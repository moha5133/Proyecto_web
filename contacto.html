<!DOCTYPE html>
<html>
<head><meta charset ="UTF-8">
<title>Inscripción</title></head>
<body><h1>Contactar con el curso</h1>
    <form>
         <label for="nombre">Nombre Completo:</label>
         <input type="text" id="nombre" name="nombre" required>
         <label for="email"> Correo Electrónico:</label>
         <input type="email" id="email" name="email"required>
         <label for="curso">Selección de curso:</label>
         <select id="curso" name="curso">
            <option value="Desarrollo Web">Desarrollo Web</option>
            <option value="Programación de Python">Programación de Python</option>
            <option value="Diseño Gráfico">Diseño Gráfico</option>
         </select>
         <p>Nivel de experiencia:</p>
         <input type="radio" id="prncipiante" name="nivel" value="Principiante">
         <label for="principiante">Principiante</label>  
         <input type="radio" id="intermedio" name="nivel" value="Intermedio">
         <label for="intermedio">Intermedio</label>  
          <input type="radio" id="avanzado" name="nivel" value="Avanzado">
         <label for="avanzado">Avanzado</label>
         <label for="comentarios">Cometarios adicionales:</label>
         <textarea id="comentarios" name="comentarios"></textarea>
         <input type="checkbox" id="términos" name="terminos" required>
         <label for="terminos">Acepto los términos y condiciones</label>
         <button type="submit">Enviar</button>



    </form>
